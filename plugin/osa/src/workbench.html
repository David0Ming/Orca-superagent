<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OSA 工作台</title><link rel="stylesheet" href="./workbench.css"></head>
<body><header class="top"><strong>任务</strong><span id="count" class="muted"></span></header><div class="toolbar"><label class="search"><span class="sr">搜索任务、项目或工作树</span><input id="search" type="search" placeholder="搜索任务、项目或工作树…"></label><label><span class="sr">筛选状态</span><select id="filter"><option value="all">全部状态</option><option value="attention">需要关注</option><option value="pending">待处理</option><option value="working">进行中</option><option value="ended">已结束</option></select></label><div class="switch" role="group" aria-label="分组方式"><button data-view="date" aria-pressed="false">日期</button><button data-view="project" aria-pressed="true">项目</button><button data-view="worktree" aria-pressed="false">工作树</button></div><button id="refresh" aria-label="刷新任务" title="刷新">↻</button></div>
<div id="notice" class="notice" role="status" hidden></div><main class="layout" id="layout"><section class="list-pane" aria-label="任务列表"><div id="list" class="list" aria-live="polite"></div></section><section class="detail-pane" aria-label="任务详情"><div id="detail" class="detail"><div class="placeholder">选择一项任务，查看已记录的交流。</div></div><form id="composer" class="composer" hidden><label class="sr" for="message">补充或回答</label><textarea id="message" rows="3" placeholder="补充要求或回答问题…"></textarea><div class="composer-actions"><span id="compose-note" class="muted">内容保存在本机，发送后以实际投递状态为准</span><button type="submit" class="primary">发送</button></div></form></section></main><script type="module" src="./workbench.js"></script></body></html>
